function legal(state,action){try{assertState(state);return checkMove(state,action);}catch(e){return {ok:false,reason:e.message};}}

function validateReport(report){

class GameSession {
  constructor(setup) {

    demand(['beginner','experienced'].includes(setup.difficulty),'Nível inválido.');

  }
  get state(){return this.states[this.cursor];}
  controller(owner=this.state.current){return this.setup.players[owner];}
  dispatch(action,report=null){

    this.commands=this.commands.slice(0,this.cursor);this.reports=this.reports.slice(0,this.cursor);this.states=this.states.slice(0,this.cursor+1);
    this.commands.push(copy(action));this.reports.push(report?copy(report):null);this.states.push(next);this.cursor++;return next;
  }
  undo(){if(this.cursor)this.cursor--;return this.state;}
  redo(){if(this.cursor<this.commands.length)this.cursor++;return this.state;}
  undoHumanTurn(){do{this.undo();}while(this.cursor>0&&this.controller()==='computer');return this.state;}
  redoHumanTurn(){do{this.redo();}while(this.cursor<this.commands.length&&this.controller()==='computer');return this.state;}
  serialize(){return JSON.stringify({format:'GEMAS-SAVE',version:1,rulesVersion:RULES_VERSION,generatorVersion:GENERATOR_VERSION,setup:this.setup,commands:this.commands,reports:this.reports,cursor:this.cursor,notes:this.notes,state:this.state},null,2);}

    demand(typeof text==='string'&&text.length<=3_000_000,'Arquivo grande demais ou inválido.');const saved=JSON.parse(text);
    demand(saved.format==='GEMAS-SAVE'&&saved.version===1,'Este arquivo não é uma partida compatível de GEMAS.');
    demand(saved.rulesVersion===RULES_VERSION&&saved.generatorVersion===GENERATOR_VERSION,'Esta partida de GEMAS usa regras anteriores. Guarde o arquivo e inicie uma nova partida para aplicar as regras atuais.');

    demand(Number.isInteger(saved.cursor)&&saved.cursor>=0&&saved.cursor<=saved.commands.length&&typeof saved.notes==='string'&&saved.notes.length<=100000,'Cursor ou notas inválidos.');

    assertState(saved.state);demand(JSON.stringify(saved.state)===JSON.stringify(session.state),'O estado salvo não confere com a reprodução.');return session;
  }

const OPPONENT_VERSION='GEMAS-AI-1';
function observeGame(state) {
  // Configuration is whitelisted by normalizeConfig: no seed, order or history.
  const {rulesVersion,generatorVersion,config,cards,board,hands,phase,current,turn,moves,endReason}=state;
  return copy({rulesVersion,generatorVersion,config,cards,board,hands,phase,current,turn,moves,endReason,deckCount:state.deck.length,...(phase==='abertura'?{opening:state.deck.slice(0,2)}:{})});
}
function worldFrom(observation,sample=0) {
  const visible=[...observation.board.filter(Boolean).map(c=>c.id),...OWNERS.flatMap(p=>observation.hands[p]),...(observation.opening||[])];
  const unseen=observation.cards.map(c=>c.id).filter(id=>!visible.includes(id));
  const publicKey=JSON.stringify([observation.board,observation.hands,observation.turn,observation.current,sample]);
  const deck=[...(observation.opening||[]),...shuffle(unseen,randomFrom(publicKey))];
  demand(deck.length===observation.deckCount,'Observação pública inconsistente.');
  return {format:'GEMAS-STATE',...copy(observation),seed:'public-information',deck,history:[]};
}
function evaluate(state,owner) {
  const points=score(state),margin=points[owner].total-points[other(owner)].total;
  if(state.phase==='finalizada')return margin*100;
  const potential=side=>{
    const own=state.board.flatMap((c,p)=>c?.owner===side?[{...c,p}]:[]);let value=0;
    for(let i=0;i<own.length;i++)for(let j=i+1;j<own.length;j++)if(adjacent(own[i].p,own[j].p,state.config.columns))for(const kind of ['color','shape'])value+=attributes(state,own[i].id,kind).filter(a=>attributes(state,own[j].id,kind).includes(a)).length*.09;
    return value;
  };
  return margin+potential(owner)-potential(other(owner))+(state.hands[owner].length-state.hands[other(owner)].length)*.18;
}
function chooseAction(observation,{difficulty='beginner',shortlist=4,samples=2}={}) {
  demand(['beginner','experienced'].includes(difficulty),'Nível inválido.');
  const worlds=Array.from({length:difficulty==='experienced'?Math.max(1,Math.min(3,samples)):1},(_,i)=>worldFrom(observation,i)),state=worlds[0],owner=state.current,actions=legalActions(state);
  if(!actions.length)return {action:null,version:OPPONENT_VERSION,reason:'Partida encerrada.',alternatives:[],candidates:0,replies:0};
  const baseline=score(state)[owner].total;
  const ranked=actions.map((action,index)=>{
    const next=dispatch({...state,history:[]},action,{validate:false});
    let value=worlds.reduce((sum,w)=>sum+evaluate(dispatch({...w,history:[]},action,{validate:false}),owner),0)/worlds.length;
    if(difficulty==='beginner')value=score(next)[owner].total-baseline+(value-(score(next)[owner].total-score(next)[other(owner)].total))*.35;
    return {action,index,value,immediate:score(next)[owner].total-baseline};
  }).sort((a,b)=>b.value-a.value||a.index-b.index);

    considered=ranked.slice(0,Math.max(1,shortlist));
    for(const candidate of considered){let sum=0;
      for(const world of worlds){const next=dispatch({...world,history:[]},candidate.action,{validate:false});
        if(next.phase==='finalizada'){sum+=evaluate(next,owner);continue;}
        const responses=legalActions(next);let best=next.current===owner?-Infinity:Infinity;
        for(const action of responses){const value=evaluate(dispatch({...next,history:[]},action,{validate:false}),owner);best=next.current===owner?Math.max(best,value):Math.min(best,value);replies++;}
        sum+=Number.isFinite(best)?best:evaluate(next,owner);
      }

    }
    considered.sort((a,b)=>b.value-a.value||a.index-b.index);
  }

  const near=considered.filter(c=>c.value>=considered[0].value-.8).slice(0,4),rng=randomFrom(JSON.stringify([state.board,state.hands,state.turn]));

  return {action:best.action,version:OPPONENT_VERSION,candidates:actions.length,replies,reason:difficulty==='beginner'?'Pontos imediatos e conexões próximas.':'Saldo de pontos, respostas adversárias e compras possíveis.',information:'Somente tabuleiro, mãos abertas, composição e quantidade do monte. Ordem e semente não são fornecidas.',alternatives:[best,...considered.filter(c=>c!==best).slice(0,2)].map(c=>({action:c.action,value:Number(c.value.toFixed(3)),immediate:c.immediate}))};
}

// Worker lifecycle is independent of the rules and the rendering layer.
class OpponentController {
 constructor({workerFactory,onResult,onError,fallback=null,timeout=30000}){this.workerFactory=workerFactory;this.onResult=onResult;this.onError=onError;this.fallback=fallback;this.timeout=timeout;this.worker=null;this.serial=0;this.key=null;this.timer=null;}
 cancel(){this.serial++;clearTimeout(this.timer);this.timer=null;this.worker?.terminate();this.worker=null;this.key=null;}
 start(key,observation){
  if(this.key===key)return;
  this.cancel();this.key=key;const serial=this.serial;let failing=false;
  const fail=message=>{
   if(serial!==this.serial||failing)return;failing=true;
   clearTimeout(this.timer);this.worker?.terminate();this.worker=null;
   if(!this.fallback){this.cancel();this.onError(message);return;}
   this.timer=setTimeout(()=>{
    if(serial!==this.serial)return;
    try{const result=this.fallback(observation);this.cancel();this.onResult(result,key);}
    catch(error){this.cancel();this.onError(error.message);}
   },30);
  };
  try {
   const worker=this.worker=this.workerFactory();
   worker.onmessage=event=>{if(serial!==this.serial||failing)return;if(event.data.error){fail(event.data.error);return;}this.cancel();this.onResult(event.data.result,key);};
   worker.onerror=event=>{if(serial!==this.serial||failing)return;event.preventDefault?.();fail(event.message||'Falha ao calcular a jogada.');};
   this.timer=setTimeout(()=>fail('O cálculo demorou demais.'),this.timeout);
   worker.postMessage(observation);
  }catch(error){fail(error.message);}
 }
}


const CONNECTION_COLORS=Object.freeze(['#d21f3c','#ee7b1e','#d19b00','#1f9d55','#2d6bd6','#7a3ec8','#e2479c','#1599a9']);

function scoreTableData(state,points=score(state)) {
  return ['color','shape'].map(kind=>{
    const values=kind==='color'?COLOR_IDS.slice(0,state.config.colors):Array.from({length:state.config.shapes},(_,i)=>i+1);
    const rows=OWNERS.map(owner=>{
      const totals=Object.fromEntries(values.map(value=>[value,0]));
      for(const chain of points[owner].chains)if(chain.kind===kind)totals[chain.value]+=chain.points;
      return {owner,points:totals,total:points[owner][kind==='color'?'colorPoints':'shapePoints']};
    });
    return {kind,values,rows};
  });
}

// A spanning tree shows each connected group without drawing every redundant edge.
function boardConnections(state) {
  const links=[],points=score(state);
  for(const owner of OWNERS)for(const {kind,value,positions:group} of points[owner].chains){
    const visited=new Set(group.slice(0,1)),pending=new Set(group.slice(1));
    while(pending.size){
      const candidates=[...visited].flatMap(from=>[...pending].filter(to=>adjacent(from,to,state.config.columns)).map(to=>({from,to,distance:Math.abs(Math.floor(from/state.config.columns)-Math.floor(to/state.config.columns))+Math.abs(from%state.config.columns-to%state.config.columns)}))).sort((a,b)=>a.distance-b.distance||a.from-b.from||a.to-b.to);
      const {from,to}=candidates[0];pending.delete(to);visited.add(to);
      links.push({owner,kind,value,from,to,scoring:group.length>=3});
    }
  }
  return links;
}

function conversionMoves(state,cardId,{position=null,target=null}={}) {
  if(state.phase!=='jogando'||!state.hands[state.current].includes(cardId))return [];
  const positions=position===null?state.config.active.filter(i=>!state.board[i]):state.config.active.includes(position)&&!state.board[position]?[position]:[];
  return positions.flatMap(p=>conversionOptions(state,cardId,p)).filter(option=>target===null||option.target===target);
}

function drawConnections(){

  if(!showChains){svg.replaceChildren();return;}

  svg.setAttribute('viewBox',`0 0 ${box.width} ${box.height}`);
  svg.innerHTML=boardConnections(session.state).map(link=>{
    const a=board.querySelector(`[data-cell="${link.from}"] .gem[data-${link.kind}="${link.value}"]`)?.getBoundingClientRect(),b=board.querySelector(`[data-cell="${link.to}"] .gem[data-${link.kind}="${link.value}"]`)?.getBoundingClientRect();
    if(!a||!b)return '';
    // Offset the two kinds so a matching color and shape remain distinguishable.
    const offset=link.kind==='shape'?3:-2,x1=a.x+a.width/2-box.x,y1=a.y+a.height/2-box.y,x2=b.x+b.width/2-box.x,y2=b.y+b.height/2-box.y,dx=x2-x1,dy=y2-y1,length=Math.hypot(dx,dy),ox=length?-dy/length*offset:0,oy=length?dx/length*offset:0;

  }).join('');
}

function rulesMarkup(){return `<h2>Como jogar GEMAS</h2><p>Branco e Preto disputam as cartas do tabuleiro. Cada carta tem duas gemas de cores e formas diferentes. Elas permanecem iguais quando a posse muda.</p><ol><li>Comece com quatro cartas abertas. Quem não começa escolhe a posse das duas cartas de abertura; cada jogador recebe uma.</li><li>Coloque uma carta da mão em qualquer casa livre. Uma colocação normal compra uma carta do monte.</li><li>Para converter, coloque da mão ao lado de uma carta adversária. A carta nova cobre uma cor do alvo; outra carta sua, já no tabuleiro e vizinha do alvo, cobre a outra cor. São sempre duas cartas diferentes. Converta um único alvo e não compre. Formas e sequências não dão proteção.</li><li>Conexões incluem lados e cantos. Para cada jogador, uma sequência conectada de três ou mais cartas vale +1 por carta, separadamente para cada cor e forma. Uma carta pode pontuar pelos quatro atributos. Cartas sem o atributo ou de outra posse não fazem ponte. Não há bônus por simples grupo de posse.</li><li>A última carta da mão não pode converter, exceto na variante. Nela, a mão vazia passa automaticamente. A partida termina com todas as casas ativas ocupadas ou com as duas mãos vazias. Conte somente as cartas no tabuleiro.</li></ol><p>Os pontos são recalculados após cada jogada. Vence o maior total; igualdade é empate. É proibido converter na primeira jogada de cada jogador e converter a última carta adversária restante no tabuleiro. A abertura não conta como jogada de nenhum jogador.</p><p class="muted">Protótipo GEMAS 0.2.0 · contrato de playtest. As opções de laboratório permitem investigar regras sem alterar a partida em andamento.</p>`;}

function setDestination(position){if(!session||isComputer()||session.state.phase!=='jogando')return;
  if(session.state.board[position]){
    if(availableConversions().some(o=>o.target===position)){
      if(selection.mode==='converter'){requestConversion(position);return;}
      selection.target=position;
    }
  }else if(selection.mode==='converter'){
    const options=conversionMoves(session.state,selection.cardId,{position,target:selection.target});
    if(!options.length){notice=help?'Escolha uma casa destacada para converter, ou use Colocar.':'Esta casa não permite a conversão. Escolha outra casa ou use Colocar.';isError=false;render();return;}
    selection.position=position;
    const targets=[...new Set(options.map(o=>o.target))];
    if(targets.length===1)selection.target=targets[0];
    if(selection.target!==null){commit(selectedAction());return;}

    selection.position=position;

      case 'lab':laboratory=!laboratory;render();break;
      case 'rules':modal='rules';render();break;
      case 'score':modal='score';render();break;
      case 'close':modal=null;render();break;
      case 'opening':commit({type:'opening',firstOwner:openingChoice});break;
      case 'play':if(selection.mode==='normal')commit(selectedAction());break;
      case 'convert':requestConversion();break;
      case 'clear':resetSelection();render();break;
      case 'undo':controller.cancel();session.undo();paused=OWNERS.some(owner=>session.setup.players[owner]==='computer');resetSelection();persist();render();break;
      case 'redo':controller.cancel();session.redo();paused=OWNERS.some(owner=>session.setup.players[owner]==='computer');resetSelection();persist();render();break;
      case 'pause':paused=!paused;render();break;
      case 'manual':controller.cancel();session.setup.players={branco:'human',preto:'human'};paused=false;notice='Controle manual nas duas mãos.';persist();render();break;
      case 'save-previous':if(previousSave())download('GEMAS-regras-anteriores.json',previousSave());break;
      case 'save':download(`GEMAS-${session.state.seed}.json`,session.serialize());break;
      case 'load':root.querySelector('#load-file').click();break;
      case 'export-log':download('GEMAS-historico.json',JSON.stringify({seed:session.state.seed,config:session.state.config,history:session.state.history},null,2));break;
    }
  }catch(error){notice=error.message;isError=true;render();}
});
root.addEventListener('change',async event=>{const el=event.target;
  try{
    if(el.id==='allow-last'){settings.allowLastConversion=el.checked;savePreferences();render();}
    if(el.id==='seed'){if(!el.value.trim())throw Error('Informe uma semente.');settings.seed=el.value.trim();savePreferences();render();}
    if(el.id==='mask'){if(el.value.trim()){const active=el.value.split(',').map(v=>Number(v.trim()));normalizeConfig({...configFromSettings(),active,positions:undefined});settings.active=active;}else delete settings.active;savePreferences();render();}
    if(el.id==='help'){help=el.checked;render();}
    if(el.id==='chains'){showChains=el.checked;render();}
    if(el.id==='points'){showPoints=el.checked;render();}
    if(el.id==='load-file'&&el.files[0]){session=GameSession.load(await el.files[0].text());screen='game';paused=false;notice='Partida de GEMAS restaurada.';resetSelection();persist();render();}
  }catch(error){notice=error.message;isError=true;render();}
});
root.addEventListener('input',event=>{if(event.target.id==='notes'){session.notes=event.target.value;persist();}});
root.addEventListener('dragstart',event=>{
  const button=event.target.closest('[data-select]');if(!button||button.disabled)return;
  draggedCardId=Number(button.dataset.select);
  event.dataTransfer.setData('text/plain',button.dataset.select);event.dataTransfer.effectAllowed='move';
});
root.addEventListener('dragover',event=>{if(event.target.closest('[data-cell]'))event.preventDefault();});
root.addEventListener('drop',event=>{
  const cell=event.target.closest('[data-cell]');if(!cell)return;event.preventDefault();
  const cardId=draggedCardId;draggedCardId=null;
  if(!session||isComputer()||session.state.phase!=='jogando'||!session.state.hands[session.state.current].includes(cardId))return;
  const position=Number(cell.dataset.cell);
  selection={cardId,position:null,target:null,mode:'normal'};
  if(session.state.board[position]){notice='Arraste a carta para uma casa livre e depois escolha OK ou Converter.';isError=false;render();return;}
  selection={cardId,position,target:null,mode:'normal'};notice='';isError=false;render();
});
document.addEventListener('dragend',()=>{draggedCardId=null;},true);
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&modal){modal=null;render();}if(event.key==='Tab'&&modal){const buttons=[...root.querySelectorAll('.dialog button')],first=buttons[0],last=buttons.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
root.addEventListener('click',event=>{if(event.target.classList.contains('modal-backdrop')){modal=null;render();}});
render();
