name: Verificar GEMAS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Conferir motor e pacote
        run: npm test
      - name: Reproduzir os arquivos independentes
        run: npm run build
      - name: Rejeitar distribuição desatualizada
        run: git diff --exit-code -- index.html ABRIR_GEMAS.html
